name: ivan-hubko-site

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CONTACT_API_URL: ${VITE_CONTACT_API_URL:?Set VITE_CONTACT_API_URL}
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-}
        VITE_LINKEDIN_URL: ${VITE_LINKEDIN_URL:-}
    restart: unless-stopped
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}
      - traefik.http.routers.ivan-site-http.rule=Host(`${SITE_HOST:?Set SITE_HOST}`)
      - traefik.http.routers.ivan-site-http.entrypoints=web
      - traefik.http.routers.ivan-site-http.middlewares=ivan-force-https@docker
      - traefik.http.routers.ivan-site-http.service=noop@internal
      - traefik.http.routers.ivan-site.rule=Host(`${SITE_HOST:?Set SITE_HOST}`)
      - traefik.http.routers.ivan-site.entrypoints=websecure
      - traefik.http.routers.ivan-site.tls=true
      - traefik.http.routers.ivan-site.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.ivan-site.middlewares=ivan-security@docker
      - traefik.http.services.ivan-site.loadbalancer.server.port=8080
      - traefik.http.middlewares.ivan-force-https.redirectscheme.scheme=https
      - traefik.http.middlewares.ivan-force-https.redirectscheme.permanent=true
      - traefik.http.middlewares.ivan-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.ivan-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.ivan-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.ivan-security.headers.frameDeny=true
      - traefik.http.middlewares.ivan-security.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.ivan-security.headers.permissionsPolicy=accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - >-
        traefik.http.middlewares.ivan-security.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src ${FRONTEND_CSP_SCRIPT_SRC:?Set FRONTEND_CSP_SCRIPT_SRC}; connect-src ${FRONTEND_CSP_CONNECT_SRC:?Set FRONTEND_CSP_CONNECT_SRC}; img-src 'self' data:; style-src 'self'; font-src 'self'; manifest-src 'self'; upgrade-insecure-requests
      - traefik.http.routers.ivan-bare-http.rule=Host(`${BARE_HOST:?Set BARE_HOST}`)
      - traefik.http.routers.ivan-bare-http.entrypoints=web
      - traefik.http.routers.ivan-bare-http.middlewares=ivan-home-redirect@docker
      - traefik.http.routers.ivan-bare-http.service=noop@internal
      - traefik.http.routers.ivan-bare.rule=Host(`${BARE_HOST:?Set BARE_HOST}`)
      - traefik.http.routers.ivan-bare.entrypoints=websecure
      - traefik.http.routers.ivan-bare.tls=true
      - traefik.http.routers.ivan-bare.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.ivan-bare.middlewares=ivan-home-redirect@docker
      - traefik.http.routers.ivan-bare.service=noop@internal
      - traefik.http.middlewares.ivan-home-redirect.redirectregex.regex=^https?://[^/]+(?:/.*)?$
      - traefik.http.middlewares.ivan-home-redirect.redirectregex.replacement=https://${SITE_HOST:?Set SITE_HOST}/
      - traefik.http.middlewares.ivan-home-redirect.redirectregex.permanent=true
      - traefik.http.routers.ivan-unregistered-http.rule=HostRegexp(`^.+[.]hubko[.]me$`) && !Host(`${SITE_HOST:?Set SITE_HOST}`) && !Host(`${CV_HOST:?Set CV_HOST}`)
      - traefik.http.routers.ivan-unregistered-http.entrypoints=web
      - traefik.http.routers.ivan-unregistered-http.priority=1
      - traefik.http.routers.ivan-unregistered-http.middlewares=ivan-home-redirect@docker
      - traefik.http.routers.ivan-unregistered-http.service=noop@internal
      - traefik.http.routers.ivan-unregistered.rule=HostRegexp(`^.+[.]hubko[.]me$`) && !Host(`${SITE_HOST:?Set SITE_HOST}`) && !Host(`${CV_HOST:?Set CV_HOST}`)
      - traefik.http.routers.ivan-unregistered.entrypoints=websecure
      - traefik.http.routers.ivan-unregistered.priority=1
      - traefik.http.routers.ivan-unregistered.tls=true
      - traefik.http.routers.ivan-unregistered.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.ivan-unregistered.middlewares=ivan-home-redirect@docker
      - traefik.http.routers.ivan-unregistered.service=noop@internal

  contact-api:
    build:
      context: .
      dockerfile: apps/contact-api/Dockerfile
    restart: unless-stopped
    environment:
      CONTACT_API_PORT: 3001
      CONTACT_ALLOWED_ORIGIN: https://${SITE_HOST:?Set SITE_HOST}
      CONTACT_DATABASE_PATH: /data/contact.sqlite
      CONTACT_RATE_LIMIT_WINDOW_SECONDS: ${CONTACT_RATE_LIMIT_WINDOW_SECONDS:-60}
      CONTACT_RATE_LIMIT_MAX_REQUESTS: ${CONTACT_RATE_LIMIT_MAX_REQUESTS:-5}
    volumes:
      - contact-api-data:/data
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}
      - traefik.http.routers.ivan-contact.rule=Host(`${SITE_HOST:?Set SITE_HOST}`) && Path(`/api/contact`)
      - traefik.http.routers.ivan-contact.entrypoints=websecure
      - traefik.http.routers.ivan-contact.priority=100
      - traefik.http.routers.ivan-contact.tls=true
      - traefik.http.routers.ivan-contact.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.ivan-contact.middlewares=ivan-contact-strip@docker,ivan-security@docker
      - traefik.http.middlewares.ivan-contact-strip.stripprefix.prefixes=/api
      - traefik.http.services.ivan-contact.loadbalancer.server.port=3001

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}

volumes:
  contact-api-data:
