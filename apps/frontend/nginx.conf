server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  location = / {
    try_files /index.html =500;
  }

  location = /cv {
    try_files /cv/index.html =404;
  }
  location = /cv/ {
    return 301 /cv;
  }

  location = /work/infrastructure-reliability {
    try_files /work/infrastructure-reliability/index.html =404;
  }
  location = /work/infrastructure-reliability/ {
    return 301 /work/infrastructure-reliability;
  }

  location = /work/operations-automation {
    try_files /work/operations-automation/index.html =404;
  }
  location = /work/operations-automation/ {
    return 301 /work/operations-automation;
  }

  location = /work/unified-platform {
    try_files /work/unified-platform/index.html =404;
  }
  location = /work/unified-platform/ {
    return 301 /work/unified-platform;
  }

  location = /work/account-automation {
    try_files /work/account-automation/index.html =404;
  }
  location = /work/account-automation/ {
    return 301 /work/account-automation;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
  }
  location = /sitemap.xml {
    try_files /sitemap.xml =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /images/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    return 301 /;
  }
}
