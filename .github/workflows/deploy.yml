name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      frontend_image:
        description: Immutable frontend image, required for a selected or first launch
        required: false
        type: string
      contact_api_image:
        description: Immutable contact API image, required for a selected or first launch
        required: false
        type: string
      deploy_frontend:
        description: Deploy the frontend service
        required: true
        type: boolean
        default: false
      deploy_contact_api:
        description: Deploy the contact API service
        required: true
        type: boolean
        default: false
      first_launch:
        description: Start the already-prepared server compose for the first time
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release-inputs:
    name: Resolve release manifest
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push')
    outputs:
      deploy_frontend: ${{ steps.release.outputs.deploy_frontend }}
      deploy_contact_api: ${{ steps.release.outputs.deploy_contact_api }}
      first_launch: ${{ steps.release.outputs.first_launch }}
      frontend_image: ${{ steps.release.outputs.frontend_image }}
      contact_api_image: ${{ steps.release.outputs.contact_api_image }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Download CI release manifest
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: .release-manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve release inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          MANUAL_CONTACT_API_IMAGE: ${{ inputs.contact_api_image }}
          MANUAL_DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
          MANUAL_DEPLOY_CONTACT_API: ${{ inputs.deploy_contact_api }}
          MANUAL_FIRST_LAUNCH: ${{ inputs.first_launch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            manifest='.release-manifest/release-manifest.json'
            [[ -f "$manifest" ]] || { echo "ERROR: CI release manifest was not found" >&2; exit 1; }
            frontend_image="$(jq -r '.frontend_image' "$manifest")"
            contact_api_image="$(jq -r '.contact_api_image' "$manifest")"
            deploy_frontend="$(jq -r '.frontend_changed' "$manifest")"
            deploy_contact_api="$(jq -r '.contact_api_changed' "$manifest")"
            first_launch=false
            commit="$CI_SHA"
          else
            frontend_image="$MANUAL_FRONTEND_IMAGE"
            contact_api_image="$MANUAL_CONTACT_API_IMAGE"
            deploy_frontend="$MANUAL_DEPLOY_FRONTEND"
            deploy_contact_api="$MANUAL_DEPLOY_CONTACT_API"
            first_launch="$MANUAL_FIRST_LAUNCH"
            commit="$MANUAL_SHA"
            if [[ "$first_launch" == "true" ]]; then
              deploy_frontend=true
              deploy_contact_api=true
            fi
          fi

          if [[ "$deploy_frontend" == "true" && -z "$frontend_image" ]]; then
            echo "ERROR: frontend deployment requires an immutable image reference" >&2
            exit 1
          fi
          if [[ "$deploy_contact_api" == "true" && -z "$contact_api_image" ]]; then
            echo "ERROR: contact API deployment requires an immutable image reference" >&2
            exit 1
          fi
          if [[ "$first_launch" == "true" && ( -z "$frontend_image" || -z "$contact_api_image" ) ]]; then
            echo "ERROR: first launch requires both immutable image references" >&2
            exit 1
          fi

          {
            echo "deploy_frontend=$deploy_frontend"
            echo "deploy_contact_api=$deploy_contact_api"
            echo "first_launch=$first_launch"
            echo "frontend_image=$frontend_image"
            echo "contact_api_image=$contact_api_image"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy selected services through the server compose
    runs-on: ubuntu-latest
    needs: release-inputs
    if: >-
      needs.release-inputs.result == 'success' &&
      (needs.release-inputs.outputs.deploy_frontend == 'true' || needs.release-inputs.outputs.deploy_contact_api == 'true')
    environment:
      name: production
      url: https://ivan.hubko.me
    steps:
      - name: Configure SSH
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "ERROR: DEPLOY_SSH_PRIVATE_KEY is missing" >&2; exit 1; }
          key="$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Validate deployment target
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "ERROR: DEPLOY_PATH must be an absolute path without shell-special characters" >&2
            exit 1
          }

      - name: Pull and restart selected images with the server compose
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_FRONTEND: ${{ needs.release-inputs.outputs.deploy_frontend }}
          DEPLOY_CONTACT_API: ${{ needs.release-inputs.outputs.deploy_contact_api }}
          FIRST_LAUNCH: ${{ needs.release-inputs.outputs.first_launch }}
          FRONTEND_IMAGE: ${{ needs.release-inputs.outputs.frontend_image }}
          CONTACT_API_IMAGE: ${{ needs.release-inputs.outputs.contact_api_image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-i "$SSH_KEY" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          {
            printf 'DEPLOY_FRONTEND=%q\n' "$DEPLOY_FRONTEND"
            printf 'DEPLOY_CONTACT_API=%q\n' "$DEPLOY_CONTACT_API"
            printf 'FIRST_LAUNCH=%q\n' "$FIRST_LAUNCH"
            printf 'FRONTEND_IMAGE=%q\n' "$FRONTEND_IMAGE"
            printf 'CONTACT_API_IMAGE=%q\n' "$CONTACT_API_IMAGE"
            printf 'GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'GHCR_READ_TOKEN=%q\n' "$GHCR_READ_TOKEN"
            cat <<'REMOTE'
          set -Eeuo pipefail

          COMPOSE_FILE="$DEPLOY_PATH/docker-compose.prod.yml"
          ENV_FILE="$DEPLOY_PATH/.env"
          STATE_FILE="$DEPLOY_PATH/.deploy-state"

          [[ -f "$COMPOSE_FILE" ]] || { echo "ERROR: server compose is missing: $COMPOSE_FILE" >&2; exit 1; }
          [[ -f "$ENV_FILE" ]] || { echo "ERROR: server environment file is missing: $ENV_FILE" >&2; exit 1; }

          set -a
          # shellcheck disable=SC1090
          . "$ENV_FILE"
          set +a

          compose() {
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"
          }

          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          export DOCKER_CONFIG
          if [[ -n "${GHCR_READ_TOKEN:-}" ]]; then
            printf '%s\n' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
          fi

          if [[ "$FIRST_LAUNCH" == "true" ]]; then
            DEPLOY_FRONTEND=true
            DEPLOY_CONTACT_API=true
          fi

          SERVICES=()
          if [[ "$DEPLOY_FRONTEND" == "true" ]]; then SERVICES+=(frontend); fi
          if [[ "$DEPLOY_CONTACT_API" == "true" ]]; then SERVICES+=(contact-api); fi
          [[ "${#SERVICES[@]}" -gt 0 ]] || { echo "Nothing to deploy."; exit 0; }

          if [[ -n "$FRONTEND_IMAGE" ]]; then export FRONTEND_IMAGE; fi
          if [[ -n "$CONTACT_API_IMAGE" ]]; then export CONTACT_API_IMAGE; fi
          compose config >/dev/null

          current_image() {
            local service="$1"
            local container
            container="$(compose ps -q "$service" 2>/dev/null || true)"
            if [[ -n "$container" ]]; then
              docker inspect --format '{{.Config.Image}}' "$container" 2>/dev/null || true
            fi
          }

          PREVIOUS_FRONTEND="$(current_image frontend)"
          PREVIOUS_CONTACT_API="$(current_image contact-api)"
          {
            printf 'PREVIOUS_FRONTEND=%q\n' "$PREVIOUS_FRONTEND"
            printf 'PREVIOUS_CONTACT_API=%q\n' "$PREVIOUS_CONTACT_API"
            printf 'DEPLOYED_FRONTEND=%q\n' "$DEPLOY_FRONTEND"
            printf 'DEPLOYED_CONTACT_API=%q\n' "$DEPLOY_CONTACT_API"
          } > "$STATE_FILE.tmp"
          chmod 600 "$STATE_FILE.tmp"
          mv -f "$STATE_FILE.tmp" "$STATE_FILE"

          compose pull "${SERVICES[@]}"

          if [[ "$DEPLOY_CONTACT_API" == "true" ]]; then
            [[ -n "$CONTACT_API_IMAGE" ]] || { echo "ERROR: contact API image is required to prepare SQLite storage" >&2; exit 1; }
            mkdir -p "$DEPLOY_PATH/data/prod/contact-api"
            docker run --rm --user root --volume "$DEPLOY_PATH/data/prod/contact-api:/data" "$CONTACT_API_IMAGE" sh -c 'chown 1000:1000 /data && chmod 770 /data'
          fi

          compose up -d --no-deps --force-recreate "${SERVICES[@]}"

          wait_healthy() {
            local service="$1"
            local container=""
            local status=""
            for _ in {1..30}; do
              container="$(compose ps -q "$service" 2>/dev/null || true)"
              if [[ -n "$container" ]]; then
                status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
                if [[ "$status" == "healthy" || "$status" == "running" ]]; then
                  echo "$service is $status"
                  return 0
                fi
                if [[ "$status" == "unhealthy" || "$status" == "exited" || "$status" == "dead" ]]; then
                  docker logs --tail 100 "$container" >&2 || true
                  echo "ERROR: $service did not become healthy" >&2
                  exit 1
                fi
              fi
              sleep 2
            done
            echo "ERROR: $service did not become healthy within 60 seconds" >&2
            exit 1
          }

          for service in "${SERVICES[@]}"; do wait_healthy "$service"; done
          echo "Release completed for: ${SERVICES[*]}"
          REMOTE
          } | ssh "${ssh_args[@]}" "$remote" "DEPLOY_PATH=$remote_path bash -s"

  smoke:
    name: Smoke test public release
    runs-on: ubuntu-latest
    needs: [release-inputs, deploy]
    if: >-
      needs.deploy.result == 'success' &&
      (needs.release-inputs.outputs.deploy_frontend == 'true' || needs.release-inputs.outputs.deploy_contact_api == 'true')
    steps:
      - name: Run public smoke checks
        env:
          SITE_SMOKE_URL: ${{ secrets.SITE_SMOKE_URL || 'https://ivan.hubko.me' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_SMOKE_URL%/}"
          for path in / /cv /robots.txt /sitemap.xml; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$base$path")"
            case "$status" in
              2*|3*) echo "PASS: $path -> $status" ;;
              *) echo "FAIL: $path -> $status" >&2; exit 1 ;;
            esac
          done

  cleanup:
    name: Remove replaced images
    runs-on: ubuntu-latest
    needs: [release-inputs, deploy, smoke]
    if: >-
      needs.deploy.result == 'success' &&
      needs.smoke.result == 'success'
    steps:
      - name: Configure SSH
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 600 "$RUNNER_TEMP/deploy-key"
          echo "key=$RUNNER_TEMP/deploy-key" >> "$GITHUB_OUTPUT"

      - name: Remove previous images after successful smoke checks
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-i "$SSH_KEY" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          {
            printf 'GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'GHCR_READ_TOKEN=%q\n' "$GHCR_READ_TOKEN"
            cat <<'REMOTE'
          set -Eeuo pipefail
          COMPOSE_FILE="$DEPLOY_PATH/docker-compose.prod.yml"
          ENV_FILE="$DEPLOY_PATH/.env"
          STATE_FILE="$DEPLOY_PATH/.deploy-state"
          [[ -f "$COMPOSE_FILE" && -f "$ENV_FILE" && -f "$STATE_FILE" ]] || { echo 'No previous image state is available; nothing to clean.'; exit 0; }
          set -a
          # shellcheck disable=SC1090
          . "$ENV_FILE"
          # shellcheck disable=SC1090
          . "$STATE_FILE"
          set +a
          compose() { docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"; }

          current_image() {
            local service="$1"
            local container
            container="$(compose ps -q "$service" 2>/dev/null || true)"
            if [[ -n "$container" ]]; then
              docker inspect --format '{{.Config.Image}}' "$container" 2>/dev/null || true
            fi
          }

          remove_previous() {
            local service="$1"
            local previous="$2"
            local current
            current="$(current_image "$service")"
            if [[ -n "$previous" && "$previous" != "$current" ]]; then
              if docker image inspect "$previous" >/dev/null 2>&1; then
                docker image rm "$previous"
                echo "Removed previous $service image: $previous"
              else
                echo "Previous $service image is already absent: $previous"
              fi
            fi
          }

          if [[ "${DEPLOYED_FRONTEND:-false}" == "true" ]]; then
            remove_previous frontend "${PREVIOUS_FRONTEND:-}"
          fi
          if [[ "${DEPLOYED_CONTACT_API:-false}" == "true" ]]; then
            remove_previous contact-api "${PREVIOUS_CONTACT_API:-}"
          fi

          {
            printf 'PREVIOUS_FRONTEND=\n'
            printf 'PREVIOUS_CONTACT_API=\n'
            printf 'DEPLOYED_FRONTEND=false\n'
            printf 'DEPLOYED_CONTACT_API=false\n'
          } > "$STATE_FILE.tmp"
          chmod 600 "$STATE_FILE.tmp"
          mv -f "$STATE_FILE.tmp" "$STATE_FILE"
          REMOTE
          } | ssh "${ssh_args[@]}" "$remote" "DEPLOY_PATH=$remote_path bash -s"

  rollback:
    name: Roll back failed release
    runs-on: ubuntu-latest
    needs: [release-inputs, deploy, smoke]
    if: >-
      always() &&
      (needs.deploy.result == 'failure' || needs.smoke.result == 'failure')
    steps:
      - name: Configure SSH
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          chmod 600 "$RUNNER_TEMP/deploy-key"
          echo "key=$RUNNER_TEMP/deploy-key" >> "$GITHUB_OUTPUT"

      - name: Restore previous images with the server compose
        env:
          SSH_KEY: ${{ steps.ssh.outputs.key }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-i "$SSH_KEY" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          {
            printf 'GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'GHCR_READ_TOKEN=%q\n' "$GHCR_READ_TOKEN"
            cat <<'REMOTE'
          set -Eeuo pipefail
          COMPOSE_FILE="$DEPLOY_PATH/docker-compose.prod.yml"
          ENV_FILE="$DEPLOY_PATH/.env"
          STATE_FILE="$DEPLOY_PATH/.deploy-state"
          [[ -f "$COMPOSE_FILE" && -f "$ENV_FILE" && -f "$STATE_FILE" ]] || { echo 'No rollback state is available.'; exit 0; }
          set -a
          # shellcheck disable=SC1090
          . "$ENV_FILE"
          # shellcheck disable=SC1090
          . "$STATE_FILE"
          set +a
          compose() { docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"; }
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          export DOCKER_CONFIG
          if [[ -n "${GHCR_READ_TOKEN:-}" ]]; then
            printf '%s\n' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null
          fi
          SERVICES=()
          if [[ "${DEPLOYED_FRONTEND:-false}" == "true" && -n "${PREVIOUS_FRONTEND:-}" ]]; then export FRONTEND_IMAGE="$PREVIOUS_FRONTEND"; SERVICES+=(frontend); fi
          if [[ "${DEPLOYED_CONTACT_API:-false}" == "true" && -n "${PREVIOUS_CONTACT_API:-}" ]]; then export CONTACT_API_IMAGE="$PREVIOUS_CONTACT_API"; SERVICES+=(contact-api); fi
          [[ "${#SERVICES[@]}" -gt 0 ]] || { echo 'No previous image is available for rollback.'; exit 0; }
          compose pull "${SERVICES[@]}"
          compose up -d --no-deps --force-recreate "${SERVICES[@]}"
          echo "Rollback completed for: ${SERVICES[*]}"
          REMOTE
          } | ssh "${ssh_args[@]}" "$remote" "DEPLOY_PATH=$remote_path bash -s"
