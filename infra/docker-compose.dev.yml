name: ivan-hubko-site-dev

networks:
  ivan-hubko-dev:
    name: ivan-hubko-dev
    driver: bridge

services:
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    networks: [ivan-hubko-dev]
    ports:
      - "5173:5173"
    environment:
      VITE_SITE_URL: http://localhost:5173
      VITE_CONTACT_API_URL: http://localhost:3001/contact
      VITE_GA4_MEASUREMENT_ID: ""
      VITE_GITHUB_URL: ""
      VITE_LINKEDIN_URL: ""
    volumes:
      - ../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
      && npm run dev -- --host 0.0.0.0"
    depends_on:
      contact-api:
        condition: service_started
    restart: unless-stopped

  contact-api:
    build:
      context: ../apps/contact-api
      dockerfile: Dockerfile.dev
    working_dir: /app
    networks: [ivan-hubko-dev]
    ports:
      - "3001:3001"
    environment:
      CONTACT_API_PORT: 3001
      CONTACT_ALLOWED_ORIGIN: http://localhost:5173
      CONTACT_DATABASE_PATH: /data/contact.sqlite
      CONTACT_RATE_LIMIT_WINDOW_SECONDS: 60
      CONTACT_RATE_LIMIT_MAX_REQUESTS: 5
    volumes:
      - ../apps/contact-api:/app
      - contact_api_node_modules:/app/node_modules
      - ./data/dev/contact-api:/data
    command: >-
      sh -c "if [ ! -x node_modules/.bin/tsx ]; then npm ci; fi
      && npm run start"
    restart: unless-stopped

volumes:
  frontend_node_modules:
  contact_api_node_modules:
