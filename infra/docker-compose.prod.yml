name: ivan-hubko-site-prod

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ivan-hubko-site-frontend:local}
    restart: unless-stopped
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traffic_net}
      - traefik.http.services.ivan-site.loadbalancer.server.port=8080
      - traefik.http.routers.ivan-site.rule=Host(`${SITE_HOST:-ivan.hubko.me}`)
      - traefik.http.routers.ivan-site.entrypoints=websecure
      - traefik.http.routers.ivan-site.tls=true
      - traefik.http.routers.ivan-site.service=ivan-site
      - traefik.http.routers.ivan-site-http.rule=Host(`${SITE_HOST:-ivan.hubko.me}`)
      - traefik.http.routers.ivan-site-http.entrypoints=web
      - traefik.http.routers.ivan-site-http.middlewares=ivan-force-https
      - traefik.http.routers.ivan-site-http.service=noop@internal
      - traefik.http.middlewares.ivan-force-https.redirectscheme.scheme=https
      - traefik.http.middlewares.ivan-force-https.redirectscheme.permanent=true

  contact-api:
    image: ${CONTACT_API_IMAGE:-ivan-hubko-site-contact-api:local}
    restart: unless-stopped
    environment:
      CONTACT_API_PORT: 3001
      CONTACT_ALLOWED_ORIGIN: https://${SITE_HOST:-ivan.hubko.me}
      CONTACT_DATABASE_PATH: /data/contact.sqlite
      CONTACT_RATE_LIMIT_WINDOW_SECONDS: ${CONTACT_RATE_LIMIT_WINDOW_SECONDS:-60}
      CONTACT_RATE_LIMIT_MAX_REQUESTS: ${CONTACT_RATE_LIMIT_MAX_REQUESTS:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID}
    volumes:
      - ./data/prod/contact-api:/data
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traffic_net}
      - traefik.http.services.ivan-contact.loadbalancer.server.port=3001
      - traefik.http.routers.ivan-contact.rule=Host(`${SITE_HOST:-ivan.hubko.me}`) && PathPrefix(`/api`)
      - traefik.http.routers.ivan-contact.entrypoints=websecure
      - traefik.http.routers.ivan-contact.priority=100
      - traefik.http.routers.ivan-contact.tls=true
      - traefik.http.routers.ivan-contact.service=ivan-contact
      - traefik.http.routers.ivan-contact.middlewares=ivan-contact-strip
      - traefik.http.middlewares.ivan-contact-strip.stripprefix.prefixes=/api

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traffic_net}
